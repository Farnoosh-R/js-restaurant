<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>جزئیات سفارش | Flavoria</title>
  </head>
  <body class="min-h-screen flex flex-col bg-[var(--color-bg)] text-white">
    <div id="header"></div>

    <main class="app-container flex-1 py-16 mt-30">
      <div class="mb-10">
        <div class="flex flex-col items-center">
          <div class="text-orange-400/50 tracking-[10px]">Your Order</div>
          <h2 class="text-center text-3xl font-bold">جزئیات سفارش</h2>
          <p class="mt-3 text-sm text-zinc-400">
            سفارش خودت رو بررسی کن و در صورت نیاز تغییر بده.
          </p>
        </div>
      </div>
      <div class="grid grid-cols-1 gap-10 lg:grid-cols-3">
        <!-- order items -->
        <section class="lg:col-span-2">
          <div class="rounded-2xl border border-white/10 bg-[#181818] p-6">
            <h2 class="mb-6 border-b border-white/10 pb-4 text-xl font-bold">
              سبد سفارش شما
            </h2>

            <div id="order-items">
              <!-- محصولات سفارش اینجا نمایش داده می‌شوند -->
            </div>
          </div>
        </section>
        <!-- order summary -->
        <aside>
          <div class="rounded-2xl border border-white/10 bg-[#181818] p-6">
            <h2 class="mb-6 border-b border-white/10 pb-4 text-xl font-bold">
              خلاصه سفارش
            </h2>

            <div class="flex justify-between text-sm text-zinc-400">
              <span>تعداد آیتم‌ها</span>
              <span id="total-items">۰</span>
            </div>

            <div class="mt-5 flex justify-between text-sm text-zinc-400">
              <span>مبلغ کل</span>
              <span id="total-price">۰ تومان</span>
            </div>

            <!-- discount code -->
            <div class="mt-6">
              <label
                for="discount-code"
                class="mb-3 block text-sm text-zinc-400"
              >
                کد تخفیف دارید؟
              </label>

              <div class="flex gap-2">
                <input
                  type="text"
                  id="discount-code"
                  placeholder="کد تخفیف را وارد کنید"
                  class="min-w-0 flex-1 rounded-lg border border-white/10 bg-[#101010] px-3 py-3 text-sm text-white outline-none focus:border-orange-400"
                />
                <button
                  type="button"
                  id="apply-discount"
                  class="rounded-lg bg-orange-400 px-4 py-2 text-sm font-bold text-white transition hover:bg-orange-500"
                >
                  اعمال
                </button>
              </div>

              <p id="discount-message" class="mt-3 text-xs"></p>
            </div>

            <div class="my-6 border-t border-white/10"></div>

            <div class="flex justify-between text-sm text-zinc-400">
              <span>مبلغ تخفیف</span>
              <span id="discount-amount">۰ تومان</span>
            </div>
            <div class="flex justify-between my-5 text-zinc-400">
              <span>مالیات (۱۰٪):</span>
              <span id="tax-amount">۰ تومان</span>
            </div>

            <div class="mt-5 flex justify-between font-bold">
              <span>مبلغ نهایی</span>
              <span id="final-price" class="text-orange-400">۰ تومان</span>
            </div>

            <div class="my-6 border-t border-white/10"></div>

            <button
              type="button"
              id="continue-order"
              class="w-full rounded-full bg-orange-400 py-3 font-bold text-white transition hover:bg-orange-500"
            >
              ثبت و ادامه
            </button>

            <a
              href="/order.html"
              class="mt-4 block text-center text-sm text-zinc-400 transition hover:text-orange-400"
            >
              بازگشت به منو
            </a>
          </div>
        </aside>
      </div>
    </main>

    <div id="footer"></div>

    <script type="module" src="/src/js/layout.js"></script>
    <script type="module" src="/src/js/order-details.js"></script>
  </body>
</html>
